[tool.ruff]
# 100-char line length — matches the backend conventions documented in CONTRIBUTING.md.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the lint policy focused on real correctness signals — pyflakes plus the
# essential pycodestyle subsets (syntax, indentation, whitespace) — rather than
# opinionated style rules. Newer ruff releases keep adding new default checks
# (UP045, UP007, BLE001, I001, ...) which flag pre-existing style choices and
# regress a previously-green pipeline. If we want to enforce more, ratchet up
# by adding rule codes here explicitly rather than relying on ruff defaults.
select = [
    "F",   # pyflakes (real bugs: undefined name, unused imports, redefinition)
    "E4",  # imports (module import syntax errors)
    "E7",  # statement-level syntax issues
    "E9",  # runtime / syntax errors
    "W6",  # deprecation warnings
]

# Explicitly ignore rules that would flag either style preferences or
# pre-existing long lines in the current codebase.
ignore = [
    "E501",  # line-too-long — 278 pre-existing hits, format not enforced here
]
